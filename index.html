<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Vendas</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js';
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCHpwH-HLrg76e-G8MbWEHuLvChqLQTk4Y",
  authDomain: "dashboard-financeiro-66c1b.firebaseapp.com",
  projectId: "dashboard-financeiro-66c1b"
};

const app = initializeApp(firebaseConfig);
window.auth = getAuth(app);
window.db = getFirestore(app);
const provider = new GoogleAuthProvider();

window.loginGoogle = () => signInWithPopup(window.auth, provider);
window.logoutUser = () => signOut(window.auth);

onAuthStateChanged(window.auth, (user) => {
  document.getElementById('loginScreen').style.display = user ? 'none' : 'flex';
  document.getElementById('appScreen').style.display = user ? 'block' : 'none';
  if(user){
    document.getElementById('userInfo').innerText = user.email;
    if(window.app) window.app.render();
  }
});
</script>

<style>
body{font-family:sans-serif;background:#0f172a;color:white}
.container{max-width:900px;margin:auto;padding:20px}
.card{background:#1f2937;padding:15px;border-radius:10px;margin-top:10px}
.sale{background:#111827;padding:10px;margin-top:10px;border-radius:10px;position:relative}
.delete{position:absolute;right:10px;top:10px;background:red;border:none;color:white;border-radius:50%;width:30px;height:30px}
</style>
</head>

<body>

<div id="loginScreen">
<button onclick="loginGoogle()">🔐 Login Google</button>
</div>

<div id="appScreen" style="display:none">
<div class="container">

<h2 id="userInfo"></h2>
<button onclick="logoutUser()">Sair</button>

<div class="card">
<form id="form">
<input type="date" id="date" required>
<input type="number" id="price" placeholder="Vendido" required>
<input type="number" id="cost" placeholder="Custo" required>
<input type="number" id="expense" placeholder="Insumos">
<button>Salvar</button>
</form>
</div>

<div id="sales"></div>

</div>
</div>

<script>
class App{
constructor(){
this.sales=[]
window.app=this
this.init()
}

init(){
form.onsubmit=(e)=>{e.preventDefault();this.add()}
}

async add(){
const user = window.auth.currentUser

const sale={
userId:user.uid,
date:date.value,
price:+price.value,
cost:+cost.value,
expense:+expense.value||0
}

sale.profit = sale.price - sale.cost - sale.expense

await addDoc(collection(db,"sales"),sale)

this.render()
form.reset()
}

async load(){
const user = window.auth.currentUser

const q = query(collection(db,"sales"), where("userId","==",user.uid))
const snap = await getDocs(q)

this.sales = snap.docs.map(d=>({id:d.id,...d.data()}))
}

async delete(id){
if(!confirm("Excluir?")) return

try{
const user = window.auth.currentUser
if(!user) return alert("Faça login")

await deleteDoc(doc(db,"sales",id))

console.log("Deletado:", id)

this.render()

}catch(e){
alert("Erro ao excluir: "+e.message)
}
}

async render(){
await this.load()

sales.innerHTML = this.sales.map(s=>`
<div class="sale">
<button class='delete' onclick='app.delete("${s.id}")'>🗑️</button>
<b>${new Date(s.date).toLocaleDateString()}</b><br>
R$ ${s.price}<br>
Lucro: ${s.profit}
</div>
`).join("")
}
}

new App()
</script>

</body>
</html>
