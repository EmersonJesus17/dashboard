*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#e2e8f0;min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center}
.container{max-width:1200px;width:100%;background:rgba(17,24,39,0.98);backdrop-filter:blur(20px);border-radius:24px;padding:40px;box-shadow:0 25px 60px rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.1);display:none}
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;gap:30px;max-width:500px;width:100%}
.login-btn{padding:20px 50px;border:none;border-radius:16px;background:linear-gradient(45deg,#4285f4,#34a853);color:white;font-weight:700;font-size:18px;cursor:pointer;box-shadow:0 12px 35px rgba(66,133,244,0.4);transition:all 0.3s;min-width:300px}
.login-btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 18px 45px rgba(66,133,244,0.6)}
.login-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;background:#4b5563}
.status{padding:15px 25px;border-radius:12px;font-weight:500;max-width:100%;word-break:break-word}
.loading{background:rgba(16,185,129,0.2);border:1px solid #10b981;color:#10b981}
.error{background:rgba(239,68,68,0.2);border:1px solid #ef4444;color:#ef4444}
.success{background:rgba(16,185,129,0.2);border:1px solid #10b981;color:#10b981}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}
.card{background:linear-gradient(145deg,#1f2937,#111827);padding:30px;border-radius:20px;box-shadow:0 15px 40px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.05)}
input,select,textarea{width:100%;padding:16px;margin:10px 0;background:#1f2937;border:2px solid #374151;color:white;border-radius:12px;font-size:16px;transition:all 0.3s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,0.1)}
button{padding:16px;border:none;border-radius:12px;background:linear-gradient(45deg,#10b981,#34d399);color:white;font-weight:700;cursor:pointer;width:100%;font-size:16px;transition:all 0.3s}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 30px rgba(16,185,129,0.4)}
button:disabled{background:#4b5563;cursor:not-allowed;transform:none}
.tabs{display:flex;margin-bottom:25px;gap:12px}
.tabs button{flex:1;padding:16px;background:#1f2937;border-radius:12px;font-weight:600;transition:all 0.3s;border:none}
.tabs button.active{background:linear-gradient(45deg,#10b981,#34d399);box-shadow:0 8px 25px rgba(16,185,129,0.4)}
.sale{background:#1f2937;padding:25px;margin-top:20px;border-radius:16px;position:relative;border-left:5px solid #10b981;box-shadow:0 8px 25px rgba(0,0,0,0.2)}
.delete{position:absolute;right:20px;top:20px;background:#ef4444;border:none;color:white;border-radius:50%;width:40px;height:40px;cursor:pointer;font-weight:bold;font-size:18px;transition:all 0.3s}
.delete:hover{transform:scale(1.1);box-shadow:0 5px 20px rgba(239,68,68,0.4)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.stat{background:linear-gradient(145deg,#1f2937,#111827);padding:25px;border-radius:16px;text-align:center;border:1px solid rgba(255,255,255,0.05);transition:transform 0.3s}
.stat:hover{transform:translateY(-5px)}
.stat b{font-size:2.2em;display:block;color:#10b981}
.user-info{position:fixed;top:20px;right:20px;background:linear-gradient(145deg,#1f2937,#111827);padding:20px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:1000;border:1px solid rgba(255,255,255,0.1)}
.logout-btn{background:linear-gradient(45deg,#ef4444,#dc2626)!important;margin-top:10px;padding:10px 20px!important;width:auto!important;font-size:14px!important}
@media(max-width:768px){.grid{grid-template-columns:1fr;gap:20px}.container{padding:25px 20px;margin:10px}.user-info{position:static;margin:20px 0 0 0;text-align:center}.tabs{flex-direction:column}}
</style>
</head>
<body>
<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
  <h1 style="font-size:3em;margin-bottom:10px">💰 Dashboard</h1>
  <p style="font-size:1.3em;color:#94a3b8;margin-bottom:20px">emersonjesus17.github.io/dashboard/</p>
  <button id="loginBtn" class="login-btn">🔐 Login Google</button>
  <div id="status" class="status"></div>
</div>

<!-- DASHBOARD -->
<div class="container" id="dashboard">
  <div class="user-info">
    <div id="userEmail" style="font-weight:600;margin-bottom:10px"></div>
    <button class="logout-btn" onclick="logout()">🚪 Sair</button>
  </div>
  
  <div style="text-align:center;margin-bottom:40px">
    <h1>💰 Dashboard de Vendas</h1>
    <p style="color:#94a3b8;font-size:1.1em">https://emersonjesus17.github.io/dashboard/</p>
  </div>
  
  <div class="grid">
    <div class="card">
      <h2 style="color:#10b981;margin-bottom:20px">➕ Nova Venda</h2>
      <form id="form">
        <input type="date" id="date" required>
        <input type="number" id="price" placeholder="💰 Vendido" step="0.01" required>
        <input type="number" id="cost" placeholder="💸 Custo" step="0.01" required>
        <input type="number" id="expense" placeholder="📦 Despesas">
        <textarea id="desc" placeholder="📝 Descrição" rows="3"></textarea>
        <button type="submit">💾 Salvar</button>
      </form>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="active" onclick="tab(event,'dash')">📊 Dashboard</button>
        <button onclick="tab(event,'list')">📋 Extrato</button>
      </div>
      
      <div id="dash">
        <select id="dashFilter" style="margin-bottom:20px"></select>
        <div class="stats" id="stats"></div>
      </div>
      
      <div id="list" style="display:none">
        <select id="filter" style="margin-bottom:20px"></select>
        <div id="sales"></div>
      </div>
    </div>
  </div>
</div>
