<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Vendas</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<!-- Firebase -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  window.firebase = {
    app: null,
    auth: null,
    db: null,
    provider: null
  };

  // SUBSTITUA PELO SEU CONFIG DO FIREBASE
 // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCHpwH-HLrg76e-G8MbWEHuLvChqLQTk4Y",
  authDomain: "dashboard-financeiro-66c1b.firebaseapp.com",
  projectId: "dashboard-financeiro-66c1b",
  storageBucket: "dashboard-financeiro-66c1b.firebasestorage.app",
  messagingSenderId: "316130119014",
  appId: "1:316130119014:web:06150e15ec58751d048ca7"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);

  // Inicializa Firebase
  window.firebase.app = initializeApp(firebaseConfig);
  window.firebase.auth = getAuth();
  window.firebase.db = getFirestore();
  window.firebase.provider = new GoogleAuthProvider();

  // Funções de Auth
  window.loginGoogle = async () => {
    try {
      const result = await signInWithPopup(window.firebase.auth, window.firebase.provider);
      console.log('Logado:', result.user);
    } catch (error) {
      console.error('Erro no login:', error);
      alert('Erro no login: ' + error.message);
    }
  };

  window.logout = async () => {
    try {
      await signOut(window.firebase.auth);
    } catch (error) {
      console.error('Erro no logout:', error);
    }
  };

  // Monitora estado de autenticação
  onAuthStateChanged(window.firebase.auth, (user) => {
    if (user) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'block';
      document.getElementById('userInfo').textContent = `Olá, ${user.displayName || user.email}`;
      if (window.app) window.app.render();
    } else {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('appScreen').style.display = 'none';
    }
  });
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI';background:#0f172a;color:#e2e8f0;padding:10px;height:100vh;display:flex;align-items:center;justify-content:center}
.container{max-width:1200px;margin:auto;background:#111827;border-radius:16px;padding:15px;width:100%;max-width:400px}
.login-container{text-align:center;padding:40px 20px}
.login-btn{padding:15px 30px;border:none;border-radius:8px;background:#4285f4;color:white;font-weight:bold;font-size:16px;cursor:pointer;margin:10px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.login-btn:hover{background:#357abd}
#appScreen{display:none}
.header{text-align:center;margin-bottom:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.card{background:#1f2937;padding:15px;border-radius:12px}
input,select,textarea{width:100%;padding:10px;margin-top:5px;background:#111827;border:1px solid #374151;color:white;border-radius:8px}
button{padding:12px;border:none;border-radius:8px;background:#10b981;color:white;font-weight:bold;cursor:pointer;width:100%}
button:disabled{background:#4b5563;cursor:not-allowed}
.tabs{display:flex;margin-bottom:10px}
.tabs button{flex:1;background:#1f2937}
.tabs button.active{background:#10b981}
.sale{background:#111827;padding:15px;margin-top:10px;border-radius:10px;position:relative}
.delete{position:absolute;right:10px;top:10px;background:red;border:none;color:white;border-radius:50%;width:30px;height:30px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#111827;padding:10px;border-radius:10px;text-align:center}
.user-info{margin-bottom:15px;padding:10px;background:#1f2937;border-radius:8px;text-align:center}
.loading{min-height:200px;display:flex;align-items:center;justify-content:center;color:#9ca3af}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<!-- TELA DE LOGIN -->
<div id="loginScreen" class="container login-container">
  <h1>💰 Dashboard de Vendas</h1>
  <p>Faça login para continuar</p>
  <button class="login-btn" onclick="loginGoogle()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Entrar com Google
  </button>
</div>

<!-- APLICAÇÃO PRINCIPAL -->
<div id="appScreen">
<div class="container">
<div class="header">
  <h1>💰 Dashboard</h1>
  <div class="user-info" id="userInfo">Carregando...</div>
  <button onclick="logout()" style="width:auto;padding:8px 16px;background:red;font-size:14px">Sair</button>
</div>

<div class="grid">
<div class="card">
<h2>Nova Venda</h2>
<form id="form">
<input type="date" id="date" required>
<input type="number" id="price" placeholder="Vendido" required step="0.01">
<input type="number" id="cost" placeholder="Custo" required step="0.01">
<input type="number" id="expense" placeholder="Insumos" step="0.01">
<textarea id="desc" placeholder="Descrição" maxlength="200"></textarea>
<button type="submit" id="saveBtn">Salvar</button>
</form>
</div>

<div class="card">
<div class="tabs">
<button class="active" onclick="app.tab(event,'dash')">Dashboard</button>
<button onclick="app.tab(event,'list')">Extrato</button>
</div>

<div id="dash">
<select id="dashFilter"></select>
<div class="stats" id="stats"></div>
</div>

<div id="list" style="display:none">
<select id="filter"></select>
<div id="sales"></div>
</div>
</div>
</div>
</div>
</div>

<script>
// SERVICE WORKER REGISTER
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(console.error);
}

class App{
  constructor(){
    this.sales = [];
    this.loading = true;
    this.init();
    window.app = this;
  }

  async init(){
    document.getElementById('form').onsubmit = (e) => {e.preventDefault(); this.add()};
    await this.render();
  }

  async add(){
    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Salvando...';

    try {
      const user = window.firebase.auth.currentUser;
      if (!user) throw new Error('Usuário não autenticado');

      const sale = {
        id: Date.now().toString(),
        userId: user.uid,
        date: document.getElementById('date').value,
        price: +document.getElementById('price').value,
        cost: +document.getElementById('cost').value,
        expense: +document.getElementById('expense').value || 0,
        desc: document.getElementById('desc').value,
        profit: 0,
        month: '',
        createdAt: new Date().toISOString()
      };

      sale.profit = sale.price - sale.cost - sale.expense;
      sale.month = new Date(sale.date).toLocaleDateString('pt-BR', {month:'short', year:'numeric'});

      await addDoc(collection(window.firebase.db, 'sales'), sale);
      
      document.getElementById('form').reset();
      await this.render();
      
    } catch (error) {
      console.error('Erro ao salvar:', error);
      alert('Erro ao salvar venda: ' + error.message);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Salvar';
    }
  }

  async delete(id){
    if(!confirm('Excluir esta venda?')) return;
    
    try {
      await deleteDoc(doc(window.firebase.db, 'sales', id));
      await this.render();
    } catch (error) {
      console.error('Erro ao excluir:', error);
      alert('Erro ao excluir venda');
    }
  }

  tab(e, t){
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    document.getElementById('dash').style.display = t === 'dash' ? 'block' : 'none';
    document.getElementById('list').style.display = t === 'list' ? 'block' : 'none';
  }

  getFilteredData(filterId){
    const filterValue = document.getElementById(filterId).value;
    return filterValue ? this.sales.filter(s => s.month === filterValue) : this.sales;
  }

  async loadSales(){
    try {
      const user = window.firebase.auth.currentUser;
      if (!user) return;

      const q = query(
        collection(window.firebase.db, 'sales'),
        where('userId', '==', user.uid),
        orderBy('date', 'desc')
      );
      
      const snapshot = await getDocs(q);
      this.sales = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    } catch (error) {
      console.error('Erro ao carregar vendas:', error);
    }
  }

  async render(){
    this.loading = true;
    document.getElementById('sales').innerHTML = '<div class="loading">Carregando...</div>';
    
    await this.loadSales();
    this.renderStats();
    this.renderList();
    this.renderFilter();
    this.renderDashFilter();
    
    this.loading = false;
  }

  renderStats(){
    const data = this.getFilteredData('dashFilter');
    const total = data.reduce((a, b) => a + b.price, 0);
    const profit = data.reduce((a, b) => a + b.profit, 0);
    
    document.getElementById('stats').innerHTML = `
      <div class='stat'>Vendas<br>${data.length}</div>
      <div class='stat'>Faturamento<br>R$ ${total.toFixed(2)}</div>
      <div class='stat'>Lucro<br>R$ ${profit.toFixed(2)}</div>
      <div class='stat'>%<br>${total ? ((profit/total)*100).toFixed(1) : 0}%</div>
    `;
  }

  renderFilter(){
    const months = [...new Set(this.sales.map(s => s.month))].sort().reverse();
    const filter = document.getElementById('filter');
    filter.innerHTML = '<option value="">Todos</option>';
    months.forEach(month => {
      filter.innerHTML += `<option value="${month}">${month}</option>`;
    });
    filter.onchange = () => this.renderList();
  }

  renderDashFilter(){
    const months = [...new Set(this.sales.map(s => s.month))].sort().reverse();
    const dashFilter = document.getElementById('dashFilter');
    dashFilter.innerHTML = '<option value="">Todos</option>';
    months.forEach(month => {
      dashFilter.innerHTML += `<option value="${month}">${month}</option>`;
    });
    dashFilter.onchange = () => this.renderStats();
  }

  renderList(){
    const data = this.getFilteredData('filter');
    const salesEl = document.getElementById('sales');
    
    if (this.loading) {
      salesEl.innerHTML = '<div class="loading">Carregando...</div>';
      return;
    }
    
    if (!data.length) {
      salesEl.innerHTML = '<div style="text-align:center;padding:40px;color:#9ca3af">Sem vendas</div>';
      return;
    }

    salesEl.innerHTML = data.map(s => `
      <div class='sale'>
        <button class='delete' onclick='app.delete("${s.id}")'>×</button>
        <b>${new Date(s.date).toLocaleDateString('pt-BR')}</b><br>
        R$ ${s.price.toFixed(2)} | Lucro: 
        <span style='color:${s.profit >= 0 ? '#10b981' : 'red'}'>
          ${s.profit.toFixed(2)}
        </span><br>
        ${s.desc || ''}
      </div>
    `).join('');
  }
}

new App();
</script>
</body>
</html>
